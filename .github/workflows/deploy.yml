name: Deploy

# Deploys the worker to Cloudflare after CI passes on main (or by hand from
# the Actions tab). Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers
# Scripts: Edit) and DATABASE_URL (the direct, non-pooled Neon connection
# string, used only to apply pending migrations before the code that needs
# them goes live), plus the repository variable CLOUDFLARE_ACCOUNT_ID. The
# local `npm run cf:deploy` remains for emergencies.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore the Next.js build cache
        # Next keeps its incremental compiler cache in .next/cache; without it every run says "No build cache found" and compiles from scratch.
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma generate
      # Build first: a bundling failure must surface before the schema moves.
      - run: npm run cf:build
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set; refusing to deploy code ahead of its migrations."
            exit 1
          fi
          npx prisma migrate deploy
      - run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
