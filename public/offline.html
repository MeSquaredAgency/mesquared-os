<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f1">
<title>Offline · MeSquared OS</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    background: radial-gradient(60rem 30rem at 10% -10%, #e8573f14, transparent 60%), #f3ede3;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1b232c;
  }
  main { max-width: 22rem; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 4px 14px #1b232c26; }
  h1 { margin: 20px 0 6px; font-size: 22px; letter-spacing: -0.01em; }
  p { margin: 0; color: #5d6670; }
  button {
    margin-top: 22px; height: 44px; padding: 0 22px; border: 0; border-radius: 12px;
    background: #121d28; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 1px 2px #1b232c33, 0 4px 12px #1b232c1f;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You&rsquo;re offline</h1>
  <p>Me² OS needs a connection to show your leads, tasks and messages. It will reload by itself when you&rsquo;re back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
